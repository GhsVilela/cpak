# CPAK with External MongoDB Database
# Use this for: Managed MongoDB service, separate MongoDB container, or existing MongoDB server
# Deployment time: < 5 minutes | Required env vars: 2
#
# When to use this file:
# - You have an existing MongoDB server or managed database service
# - You want to share a MongoDB instance between multiple applications
# - You need MongoDB running on different hardware for performance/storage reasons
#
# For simple deployment with bundled database, use: docker compose up -d
# =============================================================================

services:
  cpak:
    # For local testing/development, uncomment build and comment out image:
    build:
      context: .
      dockerfile: Dockerfile
    # For production, use published image:
    # image: ghcr.io/ghsvilela/cpak:latest
    container_name: cpak
    hostname: cpak
    ports:
      - "8000:80"
    environment:
      # Required: Flag to disable bundled MongoDB
      - EXTERNAL_DB=true
      
      # MongoDB connection string (defaults to local mongo container)
      # Examples:
      #   - Local container: mongodb://mongo:27017/cpak (default)
      #   - With auth: mongodb://username:password@mongo:27017/cpak
      #   - Atlas/managed: mongodb+srv://user:pass@cluster.mongodb.net/cpak
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/cpak}
      
      # Optional: Custom encryption key
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    volumes:
      # Only images volume needed (database is external)
      - cpak_images:/data/images
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
  
  # Optional: MongoDB container (remove if using external managed service)
  mongo:
    image: mongo:6-jammy
    container_name: cpak-mongo
    hostname: mongo
    # Uncomment to enable authentication:
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: admin
    #   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cpak_images:
    driver: local
  mongo_data:
    driver: local

# Quick Start with local MongoDB:
# 1. Create .env file:
#    MONGO_URI=mongodb://mongo:27017/cpak
#    ENCRYPTION_KEY=<generate with: openssl rand -base64 32>
# 2. docker compose -f docker-compose.external-db.yml up -d
# 3. Open browser: http://localhost:8000
#
# Quick Start with managed MongoDB (MongoDB Atlas, etc):
# 1. Remove the 'mongo' service from this file
# 2. Create .env file with your connection string:
#    MONGO_URI=mongodb+srv://user:pass@cluster.mongodb.net/cpak
#    ENCRYPTION_KEY=<generate with: openssl rand -base64 32>
# 3. docker compose -f docker-compose.external-db.yml up -d
