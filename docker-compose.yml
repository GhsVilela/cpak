services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  web:
    image: caddy:2
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "8000:80"
      - "443:443"
    environment:
      - API_BASE_URL=http://api:8080/api
    depends_on:
      - frontend
      - api

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db
    environment:
      - MONGO_INITDB_DATABASE=cpak

  api:
    build: ./backend
    environment:
      - API_PORT=8080
      - API_BASE_PATH=/api
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=cpak
      - ALLOWED_ORIGINS=http://localhost:8000
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - SCHEDULER_CRON=${SCHEDULER_CRON:-0 3 * * *}
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - XBOX_CLIENT_ID=${XBOX_CLIENT_ID:-}
      - XBOX_CLIENT_SECRET=${XBOX_CLIENT_SECRET:-}
      - PLAYSTATION_CLIENT_ID=${PLAYSTATION_CLIENT_ID:-}
      - PLAYSTATION_CLIENT_SECRET=${PLAYSTATION_CLIENT_SECRET:-}
      - STEAMGRID_API_KEY=${STEAMGRID_API_KEY:-}
      - ICONS_DIR=/app/data/icons
      - SYNC_BATCH_SIZE=${SYNC_BATCH_SIZE:-10}
      - ICON_DOWNLOAD_CONCURRENCY=${ICON_DOWNLOAD_CONCURRENCY:-5}
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    volumes:
      - cpak-icons:/app/data/icons

volumes:
  cpak-icons:
