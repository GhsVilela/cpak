services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  web:
    image: caddy:2
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "8000:80"
      - "443:443"
    environment:
      - API_BASE_URL=http://api:8080/api
    depends_on:
      - frontend
      - api

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - cpak_db:/data/db
    environment:
      - MONGO_INITDB_DATABASE=cpak
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./backend
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - MONGO_URI=mongodb://mongo:27017/cpak
    volumes:
      - cpak_images:/app/data/images
      - cpak_backups:/app/data/backups

volumes:
  cpak_db:
    driver: local
  cpak_images:
    driver: local
  cpak_backups:
    driver: local
