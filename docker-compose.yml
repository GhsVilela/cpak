services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: cpak-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cpak
    volumes:
      - mongodb_data:/data/db
    networks:
      - cpak-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/cpak --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Only expose internally - not accessible from outside
    expose:
      - "27017"

  # Backend + Frontend Application
  cpak:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cpak-app
    restart: unless-stopped
    ports:
      - "8080:8080"  # Backend API
      - "8081:8081"  # Frontend UI (Main access point)
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      TZ: UTC
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cpak-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  cpak-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
