# CPAK - Development Mode (Multi-Service Setup)
# 
# ⚠️  DEPRECATED FOR PRODUCTION USE
# This compose file is retained for development purposes only.
# It runs services as separate containers for easier debugging and development.
#
# For production deployment, use the unified container:
#   docker compose up -d  (uses docker-compose.yml with unified container)
#
# Use this file only when:
# - Developing individual services (frontend, backend, caddy)
# - Debugging service interactions
# - Testing without rebuilding the unified container
#
# =============================================================================
# Development Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml logs -f api
#   docker compose -f docker-compose.dev.yml restart api
# =============================================================================

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - api

  web:
    image: caddy:2
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "8000:80"
      - "443:443"
    environment:
      - API_BASE_URL=http://api:8080/api
    depends_on:
      - frontend
      - api

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - cpak-mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=cpak
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./backend
    environment:
      - API_PORT=8080
      - API_BASE_PATH=/api
      - MONGO_URI=mongodb://mongo:27017/cpak
      - MONGO_DB=cpak
      - ALLOWED_ORIGINS=http://localhost:8000
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - SCHEDULER_CRON=${SCHEDULER_CRON:-0 3 * * *}
      - STEAM_API_KEY=${STEAM_API_KEY:-}
      - XBOX_CLIENT_ID=${XBOX_CLIENT_ID:-}
      - XBOX_CLIENT_SECRET=${XBOX_CLIENT_SECRET:-}
      - PLAYSTATION_CLIENT_ID=${PLAYSTATION_CLIENT_ID:-}
      - PLAYSTATION_CLIENT_SECRET=${PLAYSTATION_CLIENT_SECRET:-}
      - STEAMGRID_API_KEY=${STEAMGRID_API_KEY:-}
      - IMAGES_DIR=${IMAGES_DIR:-/app/data/images}
      - SYNC_BATCH_SIZE=${SYNC_BATCH_SIZE:-10}
      - IMAGE_DOWNLOAD_CONCURRENCY=${IMAGE_DOWNLOAD_CONCURRENCY:-5}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - cpak-images-data:${IMAGES_DIR:-/app/data/images}

volumes:
  cpak-mongo-data:
    driver: local
  cpak-images-data:
    driver: local
