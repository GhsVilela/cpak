name: Release

# Trigger on semantic version tags (v1.2.3 format, including pre-releases like v1.2.3-beta)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and Publish Container Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check if pre-release
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          # Strip 'v' prefix for Docker tag (v1.2.3 -> 1.2.3)
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Pre-release detected: $TAG"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Stable release detected: $TAG"
          fi
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghsvilela/cpak
            ghcr.io/ghsvilela/cpak
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.prerelease.outputs.is_prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ steps.prerelease.outputs.is_prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.prerelease.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=CPAK
            org.opencontainers.image.description=Cross-Platform Achievement Keeper - Unified container with backend, frontend, web server, and database
            org.opencontainers.image.vendor=ghsvilela
            org.opencontainers.image.url=https://github.com/ghsvilela/cpak
            org.opencontainers.image.source=https://github.com/ghsvilela/cpak
            org.opencontainers.image.documentation=https://github.com/ghsvilela/cpak/blob/main/README.md
            org.opencontainers.image.licenses=MIT
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push to registries
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Container Images
            
            Pull the unified CPAK container:
            
            **Docker Hub:**
            ```bash
            docker pull docker.io/ghsvilela/cpak:${{ steps.prerelease.outputs.version }}
            ```
            
            **GitHub Container Registry:**
            ```bash
            docker pull ghcr.io/ghsvilela/cpak:${{ steps.prerelease.outputs.version }}
            ```
            
            ## Quick Start
            
            ```bash
            docker run -d \
              -p 8000:80 \
              -v cpak_data:/data \
              docker.io/ghsvilela/cpak:${{ steps.prerelease.outputs.version }}
            ```
            
            Access at: http://localhost:8000
            
            See the [Quick Start guide](https://github.com/ghsvilela/cpak/blob/main/README.md#quick-start) in README.md for more deployment options.
